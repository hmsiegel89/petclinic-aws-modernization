name: CDK Synth

on:
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '.github/workflows/cdk-synth.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/cdk-synth.yml'

jobs:
  synth:
    name: Synthesize CloudFormation templates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: cdk synth
        # No AWS credentials are needed or configured: the stack is account-agnostic
        # so synthesis never contacts AWS. Warnings and errors fail the job.
        run: npx cdk synth --strict

      - uses: actions/upload-artifact@v4
        with:
          name: cdk-templates
          path: infra/cdk.out/*.template.json
          retention-days: 7
