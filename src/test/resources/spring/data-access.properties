# JDBC and JPA settings used by the integration tests.
# Keeps the test suite hermetic (in-memory H2) whatever the active Maven profile is.

jdbc.initLocation=classpath:db/h2/schema.sql
jdbc.dataLocation=classpath:db/h2/data.sql

jpa.showSql=true

jdbc.driverClassName=org.h2.Driver
jdbc.url=jdbc:h2:mem:petclinic
jdbc.username=sa
jdbc.password=

jpa.database=H2
